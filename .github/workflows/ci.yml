name: CI

on:
  pull_request:
    branches:
      - main
      - "dev/**"
  push:
    branches:
      - main
      - "dev/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-2025-vs2026
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Restore build tree
        uses: actions/cache/restore@v5
        id: build-cache
        with:
          path: |
            Build/x64-Debug
            Intermediate/DeltaHeaderTool
          key: windows-x64-debug-${{ replace(github.event.pull_request.base.ref || github.ref_name, '/', '-') }}-${{ hashFiles('CMakePresets.json', 'CMakeLists.txt', 'Engine/CMakeLists.txt', 'Engine/**/CMakeLists.txt', 'Tools/DeltaHeaderTool/**') }}
          restore-keys: |
            windows-x64-debug-${{ replace(github.event.pull_request.base.ref || github.ref_name, '/', '-') }}-${{ hashFiles('CMakePresets.json', 'CMakeLists.txt', 'Engine/CMakeLists.txt', 'Engine/**/CMakeLists.txt', 'Tools/DeltaHeaderTool/**') }}-

      - name: MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure and build editor (cold)
        if: steps.build-cache.outputs.cache-matched-key == ''
        shell: cmd
        run: Tools\Scripts\rebuild-x64-debug.bat --automatic

      - name: Configure and build editor (incremental)
        if: steps.build-cache.outputs.cache-matched-key != ''
        shell: cmd
        run: |
          call Tools\Scripts\configure-x64-debug.bat --automatic
          if errorlevel 1 exit /b 1
          call Tools\Scripts\build-x64-debug.bat --automatic

      - name: Build engine tests
        shell: cmd
        run: Tools\Scripts\build-x64-debug-engine-tests.bat --automatic

      - name: Run engine tests
        shell: cmd
        run: Tools\Scripts\run-x64-debug-engine-tests.bat --automatic

      - name: Build editor tests
        shell: cmd
        run: Tools\Scripts\build-x64-debug-editor-tests.bat --automatic

      - name: Run editor tests
        shell: cmd
        run: Tools\Scripts\run-x64-debug-editor-tests.bat --automatic

      - name: Save build tree
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: |
            Build/x64-Debug
            Intermediate/DeltaHeaderTool
          key: windows-x64-debug-${{ replace(github.event.pull_request.base.ref || github.ref_name, '/', '-') }}-${{ hashFiles('CMakePresets.json', 'CMakeLists.txt', 'Engine/CMakeLists.txt', 'Engine/**/CMakeLists.txt', 'Tools/DeltaHeaderTool/**') }}
