name: CI

on:
  pull_request:
    branches:
      - main
      - "dev/**"
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: self-hosted
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Resolve cache branch id
        id: cache-branch
        shell: cmd
        env:
          BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
        run: |
          set "ID=%BRANCH:/=-%"
          echo id=%ID%>>%GITHUB_OUTPUT%

      - name: Restore build tree
        uses: actions/cache/restore@v5
        id: build-cache
        with:
          path: Build/x64-Debug
          key: windows-x64-debug-${{ steps.cache-branch.outputs.id }}-${{ hashFiles('CMakePresets.json') }}
          restore-keys: |
            windows-x64-debug-${{ steps.cache-branch.outputs.id }}-${{ hashFiles('CMakePresets.json') }}-
            windows-x64-debug-${{ steps.cache-branch.outputs.id }}-

      - name: Restore DeltaHeaderTool generated output
        uses: actions/cache/restore@v5
        id: header-cache
        with:
          path: Intermediate/DeltaHeaderTool
          key: windows-x64-dht-${{ steps.cache-branch.outputs.id }}-${{ hashFiles('Tools/DeltaHeaderTool/**') }}
          restore-keys: |
            windows-x64-dht-${{ steps.cache-branch.outputs.id }}-${{ hashFiles('Tools/DeltaHeaderTool/**') }}-
            windows-x64-dht-${{ steps.cache-branch.outputs.id }}-

      - name: MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Regenerate reflection headers
        if: steps.header-cache.outputs.cache-matched-key == ''
        shell: cmd
        run: Tools\Scripts\delta_header_force_generate.bat --automatic

      - name: Configure and build editor (cold)
        if: steps.build-cache.outputs.cache-matched-key == ''
        shell: cmd
        run: Tools\Scripts\rebuild-x64-debug.bat --automatic

      - name: Configure and build editor (incremental)
        if: steps.build-cache.outputs.cache-matched-key != ''
        shell: cmd
        run: |
          call Tools\Scripts\configure-x64-debug.bat --automatic
          if errorlevel 1 exit /b 1
          call Tools\Scripts\build-x64-debug.bat --automatic

      - name: Build engine tests
        shell: cmd
        run: Tools\Scripts\build-x64-debug-engine-tests.bat --automatic

      - name: Run engine tests
        shell: cmd
        run: Tools\Scripts\run-x64-debug-engine-tests.bat --automatic

      - name: Build editor tests
        shell: cmd
        run: Tools\Scripts\build-x64-debug-editor-tests.bat --automatic

      - name: Run editor tests
        shell: cmd
        run: Tools\Scripts\run-x64-debug-editor-tests.bat --automatic

      - name: Save build tree
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: Build/x64-Debug
          key: windows-x64-debug-${{ steps.cache-branch.outputs.id }}-${{ hashFiles('CMakePresets.json') }}

      - name: Save DeltaHeaderTool generated output
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: Intermediate/DeltaHeaderTool
          key: windows-x64-dht-${{ steps.cache-branch.outputs.id }}-${{ hashFiles('Tools/DeltaHeaderTool/**') }}
